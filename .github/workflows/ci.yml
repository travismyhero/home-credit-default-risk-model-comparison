name: test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install shared package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Validate repository contracts
        run: python -c "from pathlib import Path; from credit_risk.config import load_project_configs; load_project_configs(Path.cwd())"
      - name: Run tests
        run: python -m pytest
